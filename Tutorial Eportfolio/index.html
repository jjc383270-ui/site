<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Jason Jones</title>
    <link rel="stylesheet" href="./style.css" />

  <body>
    <section id="about-me">
      <nav>
        <div class="personal__logo">Jason Jones</div>
        <script
          src="https://kit.fontawesome.com/aa818b4d0d.js"
          crossorigin="anonymous"
        ></script>

        <ul class="nav__link--list">
          <li class="nav__link">
            <a
              href="#languages"
              class="nav__link--anchor link__hover-effect link__hover-effect--black"
            >
              Languages
            </a>
          </li>

          <li class="nav__link">
            <a
              href="#projects"
              class="nav__link--anchor link__hover-effect link__hover-effect--black"
            >
              Projects
            </a>
          </li>

          <li class="nav__link">
            <a
              href="#contact"
              class="nav__link--anchor nav__link--anchor-primary"

            </a>
          </li>
        </ul>
      </nav>
      <div class="flex-1">

              <img src="./assets/me.jpeg" alt="Picture of Jason Jones" />

              Hey, I’m <span class="text--purple">Jason Jones</span>
            </h1>

            <p class="about-me__info--para">
              I’m an aspiring software engineer with extensive knowledge of
              computer programming.
              <p>

             
              <i class="fa-brands fa-linkedin"></i>
              <i class="fa-solid fa-calendar"></i>
              <i class="fa-solid fa-headphones"></i>
              <i class="fa-brands fa-github"></i>
              <figure class="about-me__img--container">
                <img src="assets/undraw_websites.svg" class=""about-me__ alt="">
              </figure>
              </p>
          </div>
        </div>
      </div>
    </section id="languages">
    <div class="container">
      <div class="row">
        <h1 class="section__title">This is my technology stack</h1>
        <div class="language__list">
          <div class="language">
            <figure class="language__img--wrapper">
              <img src="" alt="" class="language__img">
        <img src="https://upload.wikimedia.org/wikipedia/commons/thumb/3/38/HTML5_Badge.svg/240px-HTML5_Badge.svg.png">
<img src="https://cdn.iconscout.com/icon/free/png-256/css-131-722685.png" alt="CSS logo" class="language__img">
</figure>
<img src="https://cdn.iconscout.com/icon/free/png-256/javascript-1-225993.png" alt="JavaScript logo" class="language__img">
</figure>

<img src="https://cdn.iconscout.com/icon/free/png-256/typescript-3521774-2945272.png" alt="TypeScript logo" class="language__img">
</figure>
<img src="https://cdn.iconscout.com/icon/free/png-256/vue-282497.png" alt="Vue logo" class="language__img">
</figure>
<img src="https://cdn.iconscout.com/icon/free/png-256/nuxt-dot-js-3628959-3030184.png" alt="Nuxt logo" class="language__img">
</figure>
<img src="https://cdn.iconscout.com/icon/free/png-256/react-3-1175109.png" alt="React logo" class="language__img">
</figure>
<img src="https://mobx.js.org/img/mobx.png" alt="MobX logo" class="language__img">

 </figure>

          </div>
