<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Jason Jones</title>
    <link rel="stylesheet" href="./style.css" />
    <script src="https://kit.fontawesome.com/aa818b4d0d.js" crossorigin="anonymous"></script>
  </head>

  <body>
    <section id="about-me">
      <nav>
        <div class="personal__logo">Jason Jones</div>
        <ul class="nav__link--list">
          <li class="nav__link">
            <a href="#languages" class="nav__link--anchor link__hover-effect link__hover-effect--black">Languages</a>
          </li>
          <li class="nav__link">
            <a href="#projects" class="nav__link--anchor link__hover-effect link__hover-effect--black">Projects</a>
          </li>
          <li class="nav__link">
            <a href="#contact" class="nav__link--anchor nav__link--anchor-primary">Contact</a>
          </li>
        </ul>
      </nav>

      <div class="flex-1">
        <div class="about-me__info row">
          <div class="about-me__info--container">
            <figure class="about-me__picture--mask">
              <img src="./assets/me.jpeg" alt="Picture of Jason Jones" />
            </figure>

            <h1 class="about-me__info--title">
              Hey, I'm <span class="text--purple">Jason Jones</span>
            </h1>

            <p class="about-me__info--para">
              I'm an aspiring software engineer with extensive knowledge of
              computer programming.
            </p>

            <div class="about-me__links">
              <a href="#" class="about-me__link"><i class="fa-brands fa-linkedin"></i></a>
              <a href="#" class="about-me__link"><i class="fa-solid fa-calendar"></i></a>
              <a href="#" class="about-me__link"><i class="fa-solid fa-headphones"></i></a>
              <a href="#" class="about-me__link"><i class="fa-brands fa-github"></i></a>
            </div>

            <figure class="about-me__img--container">
              <img src="./assets/undraw_websites.svg" class="about-me__img" alt="Websites illustration">
            </figure>
          </div>
        </div>
      </div>
    </section>

    <section id="languages">
      <div class="container">
        <div class="row">
          <h1 class="section__title">This is my technology stack</h1>
          <div class="language__list">

            

            </div>

          </div>
        </div>
      
    </section>
  </body>
</html>
